<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="script.js"></script>
</head>

<body>
  <div class="calculator">
    <div class="display">&nbsp;</div>
    <div class="buttons">
      <div class="row">
        <button class="number" id="number-7" onclick="pressButton(event)">7</button>
        <button class="number" id="number-8" onclick="pressButton(event)">8</button>
        <button class="number" id="number-9" onclick="pressButton(event)">9</button>
      </div>
      <div class="row">
        <button class="number" id="number-4" onclick="pressButton(event)">4</button>
        <button class="number" id="number-5" onclick="pressButton(event)">5</button>
        <button class="number" id="number-6" onclick="pressButton(event)">6</button>
      </div>
      <div class="row">
        <button class="number" id="number-1" onclick="pressButton(event)">1</button>
        <button class="number" id="number-2" onclick="pressButton(event)">2</button>
        <button class="number" id="number-3" onclick="pressButton(event)">3</button>
      </div>
      <div class="row operations">
        <button id="add" onclick="pressButton(event)">+</button>
        <button id="subtract" onclick="pressButton(event)">-</button>
        <button id="multiply" onclick="pressButton(event)">*</button>
        <button id="divide" onclick="pressButton(event)">/</button>
      </div>
      <div class="row last-row">
        <button id="clear" onclick="clearScreen()">C</button>
        <button class="number" id="number-0" onclick="pressButton(event)">0</button>
        <button id="equal" onclick="calculate()">=</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
